name: Publish NuGet Package

on:
  release:
    types: [ "published" ]

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # No --framework here. Passing it to a solution build sets TargetFramework as a global property for every
      # project, which makes the test project's ProjectReference to the library resolve to a different global
      # property set than the solution's own build request for it. MSBuild then builds the library twice in
      # parallel and the two races on bin/Release. The library is net10.0 only, so the flag bought nothing.
      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack  --configuration Release --no-build --output ./nupkgs

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" -k $NUGET_API_KEY -s https://api.nuget.org/v3/index.json
