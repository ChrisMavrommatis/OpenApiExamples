name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # No --framework. It makes MSBuild build the library twice in parallel and race on
      # bin/Release. See .agents/memory/ci-build-avoids-framework-flag.md.
      #
      # GeneratePackageOnBuild is on, so this packs too, and a broken icon, README or
      # license path fails here rather than during a release.
      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build
